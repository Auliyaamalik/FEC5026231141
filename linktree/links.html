<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <script
            src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet">
        
            <style>
                body {
                    background-color: #512937; 
                    font-family: 'Noto Serif', sans-serif;
                } 

                .menu-button {
                    width: 35px;
                    height: 35px;
                    background-color: rgba(0, 0, 0, 0.3); /* Transparan sedikit */
                    border-radius: 50%; /* Membuat bentuk lingkaran */
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    border: none;
                }
                
                .menu-button:hover {
                    background-color: #753b4f; /* Efek hover */
                }
                
                .menu-icon {
                    font-size: 18px;
                    color: white;
                }

                .nav-container {
                    display: inline-block;
                    background-color: rgba(222, 185, 185, 0.4);
                    border-radius: 50px;
                    padding: 5px 10px;
                }
                .nav-tabs-custom {
                    display: flex;
                    justify-content: center;
                    border-radius: 50px;
                }
                .nav-link-custom {
                    flex-grow: 1;
                    height: 48px;
                    border: none;
                    font-weight: bold;
                    padding: 10px 20px;
                    border-radius: 50px;
                    cursor: pointer;
                }
                .nav-link-active { background-color: black; color: white !important; }
                .nav-link-inactive { background-color: transparent; color: black; }
        </style>

    </head>
    <body>
        <nav class="navbar navbar-expand-sm">
            <button class="menu-button ml-auto mr-1 mt-2">
                <span class="menu-icon">⋯</span>
            </button>
        </nav>
        <div class="d-flex flex-column align-items-center">
            <div class="text-center mb-3" id="profile-picture">
                <img class="rounded-circle object-contain"
                    src="profilelaufey.webp" alt="profile-picture" width="96px"
                    height="96px">
            </div>
            <div class="text-center" id="profile-title">
                <h5 class="username text-white font-weight-bold">@laufey <img
                        src="verified.svg" class="verified-icon"
                        alt="Verified"></h5>
            </div>
            <div class="text-center" id="profile-description">
                <p class="text-white">silver lining out April 3 🎠</p>
            </div>
        </div>
        <div class="d-flex justify-content-center align-items-center">
            <nav class="nav-container">
                <ul class="nav nav-tabs-custom">
                    <li class="nav-item">
                        <button class="nav-link nav-link-custom nav-link-active">Links</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link nav-link-custom nav-link-inactive" onclick="location.href='shop.html'">Shop</button>
                    </li>
                </ul>
            </nav>
        </div>
    </body>
</html>
